<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tianshu's Runlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="intro.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <!-- Intro splash -->
  <div id="splash">
    <div id="splash-text">
      <div id="splash-title"><span class="splash-cursor"></span></div>
    </div>
    <div id="splash-globe-wrap">
      <canvas id="splash-canvas"></canvas>
    </div>
    <img id="splash-runner" src="logo-bgremoved.png" alt="">
  </div>

  <header class="header">
    <span class="logo"><img src="logo.jpg" alt="Runlog" class="logo-icon"> Tianshu's Runlog</span>
    <span class="route-count" id="route-count"></span>
  </header>

  <!-- Overview map (decorative) -->
  <div id="map"></div>

  <!-- Dot hover card -->
  <div class="hover-card hidden" id="hover-card">
    <img id="card-thumb" src="" alt="">
    <div class="hover-card-body">
      <div class="card-name" id="card-name"></div>
      <div class="card-location" id="card-location"></div>
      <div class="card-meta">
        <span class="card-distance" id="card-distance"></span>
        <span class="badge" id="card-difficulty"></span>
      </div>
    </div>
  </div>

  <!-- Route carousel -->
  <section class="carousel-section">
    <div class="carousel-header">
      <span class="carousel-label">Routes</span>
      <div class="carousel-arrows">
        <button class="arrow-btn" id="carousel-prev" aria-label="Previous">←</button>
        <button class="arrow-btn" id="carousel-next" aria-label="Next">→</button>
      </div>
    </div>
    <div class="carousel-wrap">
      <div class="carousel-track" id="carousel-track"></div>
    </div>
    <div class="progress-dots" id="progress-dots"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
  <script src="intro.js"></script>
</body>
</html>
