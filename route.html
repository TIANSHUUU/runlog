<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>runlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <a href="index.html" class="route-back-float" id="route-back-float">← All routes</a>

  <section class="route-hero">
    <a href="index.html" class="route-hero-back">← All routes</a>
    <div class="route-hero-loc" id="route-location"></div>
    <h1 class="route-hero-title" id="route-title"></h1>
    <div class="route-hero-points" id="route-points"></div>
    <div class="route-hero-meta"><span id="route-date"></span></div>
    <div class="route-hero-stats">
      <div class="route-hero-stat">
        <span class="route-hero-stat-v" id="stat-distance"></span>
        <span class="route-hero-stat-l">Distance</span>
      </div>
      <div class="route-hero-stat">
        <span class="route-hero-stat-v" id="stat-elevation"></span>
        <span class="route-hero-stat-l">Elevation</span>
      </div>
      <div class="route-hero-stat">
        <span class="route-hero-stat-v" id="stat-surface"></span>
        <span class="route-hero-stat-l">Surface</span>
      </div>
      <div class="route-hero-stat">
        <span class="route-hero-stat-v" id="stat-difficulty"></span>
        <span class="route-hero-stat-l">Difficulty</span>
      </div>
    </div>
  </section>

  <div id="route-map"></div>

  <div class="route-content">

    <!-- Speed legend (shown only if route has speed data) -->
    <div class="speed-legend hidden" id="speed-legend">
      <span class="speed-legend-label">Slow</span>
      <div class="speed-legend-bar"></div>
      <span class="speed-legend-label">Fast</span>
    </div>

    <!-- Description & vibe -->
    <p class="description" id="route-description"></p>
    <div class="vibe-tag" id="route-vibe"></div>

    <!-- Highlights -->
    <div class="highlights-section">
      <div class="section-title">Highlights</div>
      <div class="highlights-list" id="route-highlights"></div>
    </div>

    <!-- Photos -->
    <div class="photos-section" id="photos-section">
      <div class="section-title">Photos</div>
      <div class="photos-grid" id="route-photos"></div>
    </div>

    <!-- Nearby -->
    <div class="nearby-section" id="nearby-section">
      <div class="section-title">Nearby</div>
      <div class="nearby-list" id="route-nearby"></div>
    </div>

  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&#x2715;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 4L7 12L15 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav lightbox-next" id="lightbox-next">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 4L17 12L9 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="route.js"></script>
</body>
</html>
